<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MyWebPlace — Expert Marketplace &amp; E-commerce à Bordeaux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081D2D"/>
      <stop offset="1" stop-color="#16415F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.08" r="0.65">
      <stop offset="0" stop-color="#8CC6FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8CC6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo -->
  <g transform="translate(90,86)">
    <rect width="84" height="84" rx="20" fill="#0B2436" stroke="#8CC6FF" stroke-width="2"/>
    <text x="42" y="46" text-anchor="middle" dominant-baseline="central"
          font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#8CC6FF">M</text>
    <text x="108" y="46" dominant-baseline="central"
          font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">MyWebPlace</text>
  </g>

  <!-- Titre -->
  <text x="92" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Expert Marketplace</text>
  <text x="92" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="800" fill="#8CC6FF" letter-spacing="-1">&amp; E-commerce</text>

  <!-- Sous-titre -->
  <text x="94" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="31" fill="#FFFFFF" fill-opacity="0.85">Conseil &amp; accompagnement — Bordeaux &amp; partout en France</text>

  <!-- Plateformes -->
  <text x="94" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#CFE3F7" fill-opacity="0.9">Amazon&#160;&#160;·&#160;&#160;ManoMano&#160;&#160;·&#160;&#160;Leroy Merlin&#160;&#160;·&#160;&#160;Cdiscount&#160;&#160;·&#160;&#160;Mirakl</text>

  <!-- Domaine -->
  <g transform="translate(92,548)">
    <rect width="14" height="14" rx="3" y="6" fill="#8CC6FF"/>
    <text x="28" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#8CC6FF">mywebplace.fr</text>
  </g>
</svg>
